version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  fastapi:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - ollama
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - OLLAMA_BASE_URL=http://ollama:11434

volumes:
  mongo_data:
  ollama_data:
